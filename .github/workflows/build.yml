name: Build Geode Mod

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Windows
          os: windows-latest

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Geode CLI via Winget
        run: |
          # Instalamos el CLI usando winget
          winget install GeodeSDK.GeodeCLI --accept-package-agreements --accept-source-agreements
          # Añadimos la ruta por defecto del CLI al PATH de GitHub
          echo "C:\Users\runneradmin\AppData\Local\Microsoft\WinGet\Packages\GeodeSDK.GeodeCLI_Microsoft.Winget.Source_8wekyb3d8bbwe" >> $env:GITHUB_PATH
          # Nota: Si la ruta cambia, winget suele encargarse, pero en CI a veces hay que forzar el refresco del PATH

      - name: Setup Geode SDK
        run: |
          # Instalamos el SDK usando el CLI
          geode sdk install --path geode-sdk
          geode sdk set-path geode-sdk

      - name: Build Mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
