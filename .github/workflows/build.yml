name: Build Geode Mod

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - "main"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Windows
          os: windows-latest

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Scoop and Geode CLI
        run: |
          # Instalamos Scoop de forma silenciosa
          Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser
          Invoke-RestMethod -Uri https://get.scoop.sh | Invoke-Expression
          
          # Añadimos el bucket de extras e instalamos el CLI
          $env:PATH += ";$env:USERPROFILE\scoop\shims"
          scoop bucket add extras
          scoop install geode-sdk-cli
          
          # Aseguramos que el PATH se actualice para los siguientes pasos
          echo "$env:USERPROFILE\scoop\shims" >> $env:GITHUB_PATH

      - name: Setup Geode SDK
        run: |
          # EL TRUCO MAESTRO:
          # Usamos --no-check para que no busque Geometry Dash ni pida rutas.
          # Usamos --default para aceptar todo automáticamente.
          geode profile add default --dont-install --no-check
          
          # Instalamos el SDK en la carpeta del corredor
          geode sdk install geode-sdk
          geode sdk set-path geode-sdk

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
