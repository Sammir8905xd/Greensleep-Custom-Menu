name: Build Geode Mod

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Windows
          os: windows-latest

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Geode CLI
        run: |
          # Descargamos el CLI directamente desde GitHub releases
          $cli_url = "https://github.com/geode-sdk/cli/releases/latest/download/geode-cli-win.zip"
          curl -L $cli_url -o geode-cli.zip
          Expand-Archive -Path geode-cli.zip -DestinationPath .
          # Añadimos al PATH para poder usar 'geode'
          echo "$(pwd)" >> $env:GITHUB_PATH

      - name: Setup Geode SDK
        run: |
          # Instalamos el SDK usando el CLI que acabamos de bajar
          geode sdk install --path geode-sdk
          geode sdk set-path geode-sdk

      - name: Build Mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
