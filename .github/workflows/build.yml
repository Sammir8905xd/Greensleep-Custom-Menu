name: Build Geode Mod

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - "main"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Windows
          os: windows-latest

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Scoop and Geode CLI
        run: |
          # Instalamos Scoop
          Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser
          Invoke-RestMethod -Uri https://get.scoop.sh | Invoke-Expression
          
          # Añadimos el bucket de extras y el CLI de Geode
          scoop bucket add extras
          scoop install geode-sdk-cli
          
          # Añadimos la ruta de Scoop al PATH de GitHub
          echo "$env:USERPROFILE\scoop\shims" >> $env:GITHUB_PATH

      - name: Setup Geode SDK
        run: |
          # Inicializamos el perfil de forma no interactiva
          # Usamos un pipe para saltar cualquier prompt de setup
          echo "`n" | geode config setup
          
          # Instalamos el SDK en una carpeta local
          geode sdk install geode-sdk
          geode sdk set-path geode-sdk

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
