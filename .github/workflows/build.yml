name: Build Geode Mod

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Windows
          os: windows-latest

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Geode CLI via Winget
        run: |
          # Instalamos el CLI usando winget
          winget install GeodeSDK.GeodeCLI --accept-package-agreements --accept-source-agreements
          
          # Localizamos el ejecutable para asegurar que el comando 'geode' funcione
          $geodePath = Get-ChildItem -Path "C:\Users\runneradmin\AppData\Local\Microsoft\WinGet\Packages" -Filter "geode.exe" -Recurse | Select-Object -ExpandProperty DirectoryName -First 1
          if ($geodePath) {
              echo "Geode CLI encontrado en: $geodePath"
              echo "$geodePath" >> $env:GITHUB_PATH
          }

      - name: Setup Geode SDK
        run: |
          # Creamos el directorio de configuración manualmente para que el CLI no pregunte nada
          mkdir -p $env:LOCALAPPDATA\Geode
          
          # Usamos un comando que no requiere interacción para crear el perfil inicial
          geode profile add default --dont-install
          
          # Instalamos el SDK en una carpeta local
          geode sdk install geode-sdk
          geode sdk set-path geode-sdk

      - name: Build Mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
